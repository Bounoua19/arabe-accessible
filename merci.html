<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — L'Arabe Accessible</title>
<link rel="icon" type="image/png" href="images/logo.png">
<meta name="theme-color" content="#09190f">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Amiri:wght@400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--dark:#09190f;--gold:#c9a227;--gold2:#e8c96a;--r:8px}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:rgba(255,255,255,.04);border:1px solid rgba(201,162,39,.3);border-top:4px solid var(--gold);border-radius:14px;padding:48px 40px;max-width:460px;width:100%;text-align:center}
.check{width:72px;height:72px;border-radius:50%;background:rgba(201,162,39,.12);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--gold2);margin:0 auto 22px}
h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;margin-bottom:6px}
.ar{font-family:'Amiri',serif;font-size:20px;color:rgba(201,162,39,.6);margin-bottom:18px}
p{font-size:14px;color:rgba(255,255,255,.65);line-height:1.7;margin-bottom:14px}
.status{font-size:13px;color:rgba(255,255,255,.5);margin:18px 0}
.btn{display:inline-block;width:100%;padding:15px;background:var(--gold);color:var(--dark);font-size:16px;font-weight:700;border:none;border-radius:var(--r);cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;transition:background .2s}
.btn:hover{background:var(--gold2)}
.btn.disabled{opacity:.5;pointer-events:none}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(201,162,39,.3);border-top-color:var(--gold);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="check">✓</div>
  <h1>Merci pour votre confiance !</h1>
  <div class="ar">بارك الله فيك</div>
  <p>Votre paiement a bien été reçu. Vous avez désormais accès à <strong>toute la formation, à vie</strong>.</p>
  <div class="status" id="status"><span class="spin"></span>Activation de votre accès en cours…</div>
  <a class="btn disabled" id="btn" href="membres.html">Accéder à ma formation</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const statusEl=document.getElementById('status');
const btn=document.getElementById('btn');

function ready(){
  statusEl.innerHTML='✓ Accès activé !';
  statusEl.style.color='var(--gold2)';
  btn.classList.remove('disabled');
}

(async function(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ btn.classList.remove('disabled'); statusEl.textContent=''; return; }

  // Le webhook Stripe débloque l'accès en quelques secondes : on vérifie en boucle
  let tries=0;
  const check=async ()=>{
    tries++;
    const { data } = await sb.from('profiles').select('has_access').eq('id', session.user.id).single();
    if(data && data.has_access){ ready(); return; }
    if(tries>=12){ // ~18s : on laisse quand même passer
      statusEl.innerHTML="Votre accès s'active sous peu. Si la formation n'est pas encore débloquée, patientez une minute puis reconnectez-vous.";
      btn.classList.remove('disabled');
      return;
    }
    setTimeout(check, 1500);
  };
  check();
})();
</script>
</body>
</html>
