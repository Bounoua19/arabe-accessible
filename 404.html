<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — L'Arabe Accessible</title>
<link rel="icon" type="image/png" href="images/logo.png">
<meta name="theme-color" content="#09190f">
<!-- Sécurité : politique CSP appliquée par le navigateur (GitHub Pages n'applique pas le fichier _headers) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://*.stripe.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://*.supabase.co https://*.stripe.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-src https://js.stripe.com https://*.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>if(window.top!==window.self){try{window.top.location=window.self.location}catch(e){document.documentElement.style.display="none"}}</script>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Amiri:wght@400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--dark:#09190f;--gold:#c9a227;--gold2:#e8c96a}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{max-width:440px}
.logo{height:80px;width:80px;object-fit:contain;border-radius:50%;border:2px solid rgba(201,162,39,.4);margin:0 auto 22px;display:block}
.code{font-family:'Cormorant Garamond',serif;font-size:84px;font-weight:600;color:var(--gold);line-height:1}
.ar{font-family:'Amiri',serif;font-size:22px;color:rgba(201,162,39,.6);margin:6px 0 18px}
h1{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;margin-bottom:10px}
p{font-size:14px;color:rgba(255,255,255,.6);line-height:1.7;margin-bottom:26px}
a{display:inline-block;padding:14px 30px;background:var(--gold);color:var(--dark);font-size:15px;font-weight:700;border-radius:6px;text-decoration:none;transition:background .2s}
a:hover{background:var(--gold2)}
.alt{display:block;margin-top:16px;font-size:13px;color:rgba(255,255,255,.4)}
.alt a{display:inline;padding:0;background:none;color:var(--gold2);font-weight:600}
</style>
</head>
<body>
<div class="box">
  <img src="images/logo.png" class="logo" alt="L'Arabe Accessible" onerror="this.src='logo.png'">
  <div class="code">404</div>
  <div class="ar">الصفحة غير موجودة</div>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être erroné ou la page a été déplacée. Pas d'inquiétude, vous pouvez revenir à l'accueil.</p>
  <a href="index.html">Retour à l'accueil</a>
  <span class="alt">Déjà membre ? <a href="membres.html">Se connecter</a></span>
</div>
</body>
</html>
