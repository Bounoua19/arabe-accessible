<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer mon compte — L'Arabe Accessible</title>
<link rel="icon" type="image/png" href="images/logo.png">
<meta name="theme-color" content="#09190f">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--dark:#09190f;--green:#1a4029;--gold:#c9a227;--gold2:#e8c96a;--r:8px}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:rgba(255,255,255,.04);border:1px solid rgba(201,162,39,.3);border-top:4px solid var(--gold);border-radius:14px;padding:44px 40px;max-width:440px;width:100%;text-align:center}
.logo{height:74px;width:74px;object-fit:contain;border-radius:50%;border:2px solid rgba(201,162,39,.4);margin:0 auto 18px;display:block}
h1{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;margin-bottom:6px}
.sub{font-size:14px;color:rgba(255,255,255,.55);margin-bottom:28px;line-height:1.6}
label{display:block;text-align:left;font-size:12px;color:rgba(255,255,255,.6);margin:14px 0 6px;font-weight:500}
input{width:100%;padding:13px 16px;border:1px solid rgba(255,255,255,.2);border-radius:var(--r);background:rgba(255,255,255,.07);color:#fff;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
input:focus{border-color:var(--gold)}
input::placeholder{color:rgba(255,255,255,.3)}
.hint-pwd{font-size:11px;color:rgba(255,255,255,.4);text-align:left;margin-top:6px}
button{width:100%;padding:15px;background:var(--gold);color:var(--dark);font-size:16px;font-weight:700;border:none;border-radius:var(--r);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .25s;margin-top:22px}
button:hover{background:var(--gold2)}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:13px;margin-top:16px;padding:12px 14px;border-radius:var(--r);display:none;line-height:1.6;text-align:left}
.msg.err{display:block;background:rgba(224,80,80,.12);border:1px solid rgba(224,80,80,.4);color:#ff9a9a}
.msg.ok{display:block;background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.4);color:var(--gold2)}
.foot{font-size:13px;color:rgba(255,255,255,.4);margin-top:22px}
.foot a{color:var(--gold)}
.back{display:inline-block;margin-top:14px;font-size:12px;color:rgba(255,255,255,.35)}
</style>
</head>
<body>
<div class="box">
  <img src="images/logo.png" class="logo" alt="Logo" onerror="this.src='logo.png'">
  <h1>Créer mon compte</h1>
  <div class="sub">Choisissez votre adresse email et votre mot de passe pour accéder à votre formation.</div>

  <div id="form">
    <label for="email">Adresse email</label>
    <input type="email" id="email" placeholder="vous@exemple.com" autocomplete="email">

    <label for="pass">Mot de passe</label>
    <input type="password" id="pass" placeholder="Au moins 8 caractères" autocomplete="new-password">
    <div class="hint-pwd">8 caractères minimum. Choisissez un mot de passe que vous seul connaissez.</div>

    <label for="pass2">Confirmer le mot de passe</label>
    <input type="password" id="pass2" placeholder="Retapez votre mot de passe" autocomplete="new-password" onkeydown="if(event.key==='Enter')register()">

    <button id="btn" onclick="register()">Créer mon compte</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="foot">Vous avez déjà un compte ? <a href="membres.html">Se connecter</a></div>
  <a class="back" href="index.html">← Retour au site</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
function showMsg(text, type){
  const m=document.getElementById('msg');
  m.textContent=text;
  m.className='msg '+type;
}
async function register(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value;
  const pass2=document.getElementById('pass2').value;
  const btn=document.getElementById('btn');

  if(!email || !email.includes('@')){ showMsg("Veuillez entrer une adresse email valide.","err"); return; }
  if(pass.length<8){ showMsg("Le mot de passe doit contenir au moins 8 caractères.","err"); return; }
  if(pass!==pass2){ showMsg("Les deux mots de passe ne sont pas identiques.","err"); return; }

  btn.disabled=true; btn.textContent="Création en cours…";
  const { data, error } = await sb.auth.signUp({
    email: email,
    password: pass,
    options:{ emailRedirectTo: window.location.origin + '/membres.html' }
  });
  btn.disabled=false; btn.textContent="Créer mon compte";

  if(error){ showMsg(traduireErreurAuth(error.message),"err"); return; }

  if(data.session){
    // Confirmation email désactivée : on enchaîne directement sur le paiement
    showMsg("Compte créé ! Redirection vers le paiement sécurisé…","ok");
    setTimeout(()=>{ window.location.href='paiement.html'; }, 1200);
  } else {
    // Confirmation email activée
    document.getElementById('form').style.display='none';
    showMsg("✓ Compte créé ! Un email de confirmation vous a été envoyé. Cliquez sur le lien reçu, puis connectez-vous pour finaliser votre inscription.","ok");
  }
}
</script>
</body>
</html>
